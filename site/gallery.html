<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetings</title>
<!-- The owner's view of every recorded call, on one screen: the calls on the
     left, the selected call (video, status, next steps, recap link) on the
     right. Private: never indexed. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<script src="config.js"></script>
<style>
  :root {
    --ground: #f7f4ef; --surface: #ffffff; --ink: #202020; --muted: #6b6358; --dim: #8a8176;
    --border: #e7e0d6; --border-strong: #d6cdbf; --accent: #8c5a3c; --accent-soft: #f1e6de;
    --ok: #2f7a4d; --ok-soft: #e4f2e9; --warn: #9a6a12; --warn-soft: #f8eed8; --bad: #a33a2b; --bad-soft: #f7e3df;
    --r: 14px; --r-inner: 10px;
    --font: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; background: var(--ground); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--border); background: #fbf9f5; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .brand img { width: 22px; height: 22px; border-radius: 5px; object-fit: contain; }
  h1 { margin: 0; font-size: 17px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  .sample { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 9px; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 340px) 1fr; }
  nav { overflow: auto; border-right: 1px solid var(--border); padding: 12px; }
  nav ol { list-style: none; margin: 0; padding: 0; }
  nav button { display: block; width: 100%; text-align: left; margin: 0 0 6px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--r-inner); background: var(--surface); color: inherit; font: inherit; cursor: pointer; }
  nav button:hover { border-color: var(--border-strong); }
  nav button[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: #fffaf5; }
  .nt { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nm { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 3px; color: var(--muted); font-size: 12px; }
  .pill { font-size: 11px; font-weight: 600; border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .pill.ok { color: var(--ok); background: var(--ok-soft); } .pill.warn { color: var(--warn); background: var(--warn-soft); }
  .pill.bad { color: var(--bad); background: var(--bad-soft); } .pill.mute { color: var(--muted); background: var(--ground); }
  section { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 14px; padding: 14px 18px 18px; }
  .player { position: relative; width: min(100%, calc(48vh * 16 / 9)); aspect-ratio: 16 / 9; background: #111; border-radius: var(--r); overflow: hidden; }
  .player iframe, .player img, .player button { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player img { object-fit: cover; opacity: .92; }
  .player button { background: none; cursor: pointer; padding: 0; }
  .still { position: absolute; inset: 0; background: radial-gradient(120% 90% at 30% 20%, #a8744f 0%, #6e452c 45%, #2a1a10 100%); }
  .play { position: absolute; inset: 0; display: grid; place-items: center; }
  .play svg { width: 60px; height: 60px; filter: drop-shadow(0 2px 8px rgba(0,0,0,.45)); }
  .ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 18px; color: #d8d2c8; font-size: 13px; }
  .ph b { display: block; font-size: 15px; color: #f3eee7; margin-bottom: 2px; }
  .detail { min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); gap: 10px 18px; }
  .dh { min-width: 0; }
  .dt { margin: 0; font-size: 17px; font-weight: 700; }
  .dm { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .acts { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 8px; }
  .steps { grid-column: 1 / -1; min-height: 0; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; }
  .steps h2 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .steps ul { margin: 0; padding: 0; list-style: none; }
  .steps li { padding: 4px 0; border-top: 1px solid var(--border); color: var(--muted); }
  .steps li:first-child { border-top: 0; }
  .steps li b { color: var(--ink); font-weight: 600; }
  .steps p { margin: 0; color: var(--dim); }
  .btn { display: inline-flex; align-items: center; min-height: 34px; padding: 0 12px; border-radius: var(--r-inner); border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; }
  .btn:hover { border-color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .center { grid-column: 1 / -1; display: grid; place-items: center; padding: 24px; }
  .key { width: 100%; max-width: 440px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
  .key label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .key input { width: 100%; font: inherit; padding: 9px 11px; border: 1px solid var(--border-strong); border-radius: var(--r-inner); margin-bottom: 10px; }
  .key p { margin: 8px 0 0; font-size: 12px; color: var(--dim); }
  .state { color: var(--muted); }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    nav { border-right: 0; border-bottom: 1px solid var(--border); max-height: 30vh; }
    section { overflow: auto; display: block; } section > * + * { margin-top: 14px; }
    .detail { display: block; } .acts { margin-top: 10px; } .steps { margin-top: 12px; }
  }
</style>
</head>
<body>
<header>
  <span class="brand" id="brand"></span>
  <h1>Meetings</h1><span class="sample hidden" id="sampleTag">Sample data</span>
  <p>Every recorded call: the video, what was agreed, and the recap page to send.</p>
</header>
<main id="main">
  <div class="center" id="gate">
    <form class="key hidden" id="keyForm">
      <label for="key">Recorder key</label>
      <input id="key" type="password" autocomplete="off" placeholder="Your RECORDER_SECRET">
      <button class="btn" type="submit">Show meetings</button>
      <p>Kept in this browser only. It is the same secret your recorder function checks.</p>
    </form>
    <div class="state" id="state">Loading…</div>
  </div>
  <nav class="hidden" id="list" aria-label="Recorded calls"><ol id="items"></ol></nav>
  <section class="hidden" id="view"></section>
</main>

<script>
(function () {
  var CFG = window.RECAP_CONFIG || {};
  var API = CFG.recorder || "";
  var q = new URLSearchParams(location.search);
  var MOCK = q.get("mock") === "1" || q.get("sample") === "1";
  var $ = function (i) { return document.getElementById(i); };
  var esc = function (s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
  var PLAY = '<svg viewBox="0 0 68 48" aria-hidden="true"><path d="M66.5 7.7a8.6 8.6 0 0 0-6-6C55.2 0 34 0 34 0S12.8 0 7.5 1.7a8.6 8.6 0 0 0-6 6C0 13 0 24 0 24s0 11 1.5 16.3a8.6 8.6 0 0 0 6 6C12.8 48 34 48 34 48s21.2 0 26.5-1.7a8.6 8.6 0 0 0 6-6C68 35 68 24 68 24s0-11-1.5-16.3z" fill="#c4302b"/><path d="M45 24 27 14v20z" fill="#fff"/></svg>';
  var store = { get: function () { try { return localStorage.getItem("recorder.key") || ""; } catch (e) { return ""; } },
                set: function (v) { try { localStorage.setItem("recorder.key", v); } catch (e) {} } };
  var meetings = [];

  function when(iso) { try { return new Date(iso).toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); } catch (e) { return ""; } }
  function mins(a, b) { var m = Math.round((Date.parse(b) - Date.parse(a)) / 60000); return m > 0 ? m + " min" : ""; }
  function status(m) {
    if (m.status === "published" && m.youtubeId) return ["On YouTube", "ok"];
    if (m.status === "publishing") return ["Uploading", "warn"];
    if (m.status === "failed") return ["Upload retrying", "bad"];
    return ["Processing", "mute"];
  }

  function row(m, i) {
    var st = status(m);
    return '<li><button type="button" data-i="' + i + '"' + (i === 0 ? ' aria-current="true"' : "") + '>' +
      '<span class="nt">' + esc(m.title || "Call") + '</span>' +
      '<span class="nm"><span>' + esc([when(m.startedAt), mins(m.startedAt, m.endedAt)].filter(Boolean).join(" · ")) + '</span>' +
      '<span class="pill ' + st[1] + '">' + esc(st[0]) + "</span></span></button></li>";
  }

  function detail(m) {
    var st = status(m);
    var player = m.sampleVideo
      ? '<button type="button" data-sample="1" aria-label="Play the sample recording"><span class="still"></span><span class="play">' + PLAY + '</span></button>'
      : m.youtubeId
      ? '<button type="button" data-yt="' + esc(m.youtubeId) + '" aria-label="Play the recording"><img alt="" src="https://i.ytimg.com/vi/' + encodeURIComponent(m.youtubeId) + '/hqdefault.jpg"><span class="play">' + PLAY + "</span></button>"
      : '<div class="ph"><div><b>' + esc(st[0]) + "</b>The video appears here once YouTube has it.</div></div>";
    var steps = (m.nextSteps || []).filter(function (s) { return s && s.text; });
    var stepsHtml = steps.length
      ? "<ul>" + steps.map(function (s) { return "<li>" + (s.owner ? "<b>" + esc(s.owner) + ":</b> " : "") + esc(s.text) + "</li>"; }).join("") +
        (m.moreSteps ? '<li style="color:var(--dim)">+' + m.moreSteps + " more on the recap page</li>" : "") + "</ul>"
      : "<p>" + (m.analysed ? "None were agreed on this call." : m.hasTranscript ? "Being written now." : "Waiting for the transcript.") + "</p>";
    return '<div class="player">' + player + '</div>' +
      '<div class="detail"><div class="dh"><p class="dt">' + esc(m.title || "Call") + '</p><p class="dm">' + esc([when(m.startedAt), mins(m.startedAt, m.endedAt)].filter(Boolean).join("  ·  ")) + "</p>" +
      '<div class="pills"><span class="pill ' + st[1] + '">' + esc(st[0]) + '</span><span class="pill ' + (m.analysed ? "ok" : "mute") + '">' + (m.analysed ? "Analysed" : "Analysis pending") + "</span></div></div>" +
      '<div class="acts">' + (m.recapUrl ? '<a class="btn primary" href="' + esc(m.recapUrl) + '" target="_blank" rel="noreferrer">Recap page</a><button class="btn" type="button" data-copy="' + esc(m.recapUrl) + '">Copy link</button>' : '<span class="dm">Recap link: set recap_site_url</span>') + "</div>" +
      '<div class="steps"><h2>Next steps</h2>' + stepsHtml + "</div></div>";
  }

  function select(i) {
    [].forEach.call($("items").querySelectorAll("button"), function (b) { if (+b.dataset.i === i) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current"); });
    $("view").innerHTML = detail(meetings[i]);
  }

  function render(list, brand) {
    brand = brand || CFG.brand || {};
    if (/^#[0-9a-f]{6}$/i.test(brand.accent || "")) document.documentElement.style.setProperty("--accent", brand.accent);
    $("brand").innerHTML = (brand.logoUrl ? '<img alt="" src="' + esc(brand.logoUrl) + '">' : "") + esc(brand.name || "");
    meetings = list;
    if (!list.length) {
      $("gate").classList.remove("hidden"); $("state").classList.remove("hidden");
      $("state").textContent = "No meetings yet. Send the notetaker to a call and it appears here when the call ends.";
      return;
    }
    $("gate").classList.add("hidden"); $("list").classList.remove("hidden"); $("view").classList.remove("hidden");
    $("items").innerHTML = list.map(row).join("");
    select(0);
  }

  $("items").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-i]");
    if (b) select(+b.dataset.i);
  });

  // The detail pane: play swaps the still for the player; copy the recap link.
  $("view").addEventListener("click", function (ev) {
    var p = ev.target.closest("button[data-yt]");
    if (p) {
      var f = document.createElement("iframe");
      f.title = "Meeting recording";
      f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
      f.allowFullscreen = true;
      f.referrerPolicy = "strict-origin-when-cross-origin";
      f.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(p.dataset.yt) + "?autoplay=1&rel=0&modestbranding=1&playsinline=1";
      p.replaceWith(f);
      return;
    }
    var sm = ev.target.closest("button[data-sample]");
    if (sm) {
      var note = document.createElement("div");
      note.className = "ph";
      note.innerHTML = "<div><b>Sample data</b>In your install, this call's unlisted YouTube recording plays right here.</div>";
      sm.replaceWith(note);
      return;
    }
    var c = ev.target.closest("button[data-copy]");
    if (c && navigator.clipboard) navigator.clipboard.writeText(c.dataset.copy).then(function () { c.textContent = "Copied"; });
  });

  function load(key) {
    $("state").classList.remove("hidden");
    $("state").textContent = "Loading…";
    fetch(API + "?action=list", { headers: { "x-recorder-secret": key } })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(r.status === 401 ? "That key was not accepted." : (j.error || "The list did not load (" + r.status + ").")); return j; }); })
      .then(function (j) { $("keyForm").classList.add("hidden"); render(j.meetings || []); })
      .catch(function (e) { $("keyForm").classList.remove("hidden"); $("state").textContent = e.message; });
  }

  // SAMPLE DATA, on any host, for demos and the Marketplace preview. No
  // request is made and the page says it is a sample.
  if (MOCK) {
    $("sampleTag").classList.remove("hidden");
    render([
      { title: "Discovery call — Northwind Landscaping", startedAt: "2026-09-17T17:00:00Z", endedAt: "2026-09-17T17:56:00Z", status: "published", youtubeId: "sample", sampleVideo: true, analysed: true, hasTranscript: true,
        nextSteps: [{ owner: "Jake", text: "Send a written plan with scope, timeline and price by Friday." }, { owner: "Kevin", text: "Share read access to the lead spreadsheet." }, { owner: "Kevin", text: "Book the plan review for next week." }], moreSteps: 1, recapUrl: "index.html?mock=1" },
      { title: "Pilot kickoff — Harbor Advisory", startedAt: "2026-09-15T14:00:00Z", endedAt: "2026-09-15T14:25:00Z", status: "publishing", youtubeId: null, analysed: true, hasTranscript: true,
        nextSteps: [{ owner: "Andrew", text: "Confirm the pilot team of five." }], moreSteps: 0, recapUrl: "index.html?mock=1" },
      { title: "Intro call — Sam Lee", startedAt: "2026-09-21T15:00:00Z", endedAt: "2026-09-21T15:31:00Z", status: "pending", youtubeId: null, analysed: false, hasTranscript: true, nextSteps: [], moreSteps: 0, recapUrl: "index.html?mock=1" },
    ], { name: "Your Company", accent: "#8c5a3c" });
    return;
  }

  if (!API || API.indexOf("<project-ref>") !== -1) { $("state").textContent = "This page is not configured yet: set the recorder function URL in config.js."; return; }
  $("keyForm").addEventListener("submit", function (ev) { ev.preventDefault(); var k = $("key").value.trim(); if (k) { store.set(k); load(k); } });
  var saved = store.get();
  if (saved) load(saved); else { $("keyForm").classList.remove("hidden"); $("state").classList.add("hidden"); }
})();
</script>
</body>
</html>

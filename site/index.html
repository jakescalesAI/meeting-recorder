<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting recap</title>
<!-- One page per call, opened by a signed link. Private recordings: never
     indexed, and no referrer leaves the page. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<script src="config.js"></script>
<style>
  :root {
    --ground: #f7f4ef; --surface: #ffffff; --ink: #202020; --muted: #6b6358; --dim: #8a8176;
    --border: #e7e0d6; --border-strong: #d6cdbf; --accent: #8c5a3c; --accent-soft: #f1e6de;
    --r: 18px; --r-inner: 10px;
    --font: Inter, 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  .hidden { display: none !important; }
  .bar { max-width: 860px; margin: 0 auto; padding: 22px 16px 8px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .bar img { width: 26px; height: 26px; border-radius: 6px; object-fit: contain; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px 72px; }
  .top { margin: 10px 2px 24px; }
  .label { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: clamp(1.75rem, 5vw, 2.25rem); font-weight: 800; line-height: 1.1; letter-spacing: -.03em; margin: 0 0 8px; }
  .meta { margin: 0; color: var(--muted); font-size: 15px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px 22px; margin-bottom: 14px; }
  .card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  h2 { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .dl { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: var(--r-inner);
        border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .dl:hover { border-color: var(--ink); }
  .dl svg { width: 14px; height: 14px; }
  .steps { list-style: none; margin: 0; padding: 0; counter-reset: s; }
  .steps li { counter-increment: s; display: flex; gap: 12px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--border); font-size: 15px; }
  .steps li:first-child { border-top: 0; padding-top: 2px; }
  .steps li::before { content: counter(s); flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent);
                      font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; transform: translateY(-1px); }
  .steps .t { flex: 1; min-width: 0; }
  .owner { flex: none; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--ground); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; }
  .empty { margin: 0; color: var(--muted); font-size: 14px; }
  .player { position: relative; aspect-ratio: 16 / 9; background: #111; border-radius: var(--r-inner); overflow: hidden; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player .ph { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 20px; color: #cfcac1; font-size: 14px; }
  .under { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .note { font-size: 12px; color: var(--dim); margin: -4px 0 10px; }
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 76px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--border); }
  .tl li:first-child { border-top: 0; padding-top: 2px; }
  .at { align-self: start; min-height: 30px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink);
        font: inherit; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; padding: 0 10px; }
  .at:hover { border-color: var(--accent); color: var(--accent); }
  .at[disabled] { cursor: default; color: var(--muted); }
  .tl strong { display: block; font-size: 15px; }
  .tl p { margin: 3px 0 0; font-size: 14px; color: var(--muted); }
  .turns { margin-top: 12px; max-height: 26rem; overflow: auto; border-top: 1px solid var(--border); }
  .turn { padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .turn b { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
  footer { margin-top: 26px; font-size: 12px; color: var(--dim); text-align: center; }
  .state { text-align: center; padding: 96px 20px; color: var(--muted); }
  @media (max-width: 560px) { .tl li { grid-template-columns: 1fr; gap: 6px; } .at { justify-self: start; } }
</style>
</head>
<body>
<div class="bar" id="brand"></div>
<div id="state" class="state">Loading…</div>

<main id="content" class="wrap hidden">
  <div class="top">
    <p class="label">Meeting recap</p>
    <h1 id="title">Your call</h1>
    <p class="meta" id="meta"></p>
  </div>

  <section class="card">
    <div class="card__head"><h2>Next steps</h2><button class="dl" id="dlSteps" type="button"></button></div>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="card" id="videoCard">
    <div class="card__head"><h2>Recording</h2></div>
    <div class="player" id="player"></div>
    <div class="under">
      <button class="dl hidden" id="dlTranscript" type="button"></button>
      <button class="dl hidden" id="toggleTranscript" type="button" aria-expanded="false">Read transcript</button>
    </div>
    <div class="turns hidden" id="turns"></div>
  </section>

  <section class="card hidden" id="tlCard">
    <div class="card__head"><h2>Timeline</h2><button class="dl" id="dlTimeline" type="button"></button></div>
    <p class="note hidden" id="tlNote">Times are approximate, worked out from where each part falls in the transcript.</p>
    <ol class="tl" id="timeline"></ol>
  </section>

  <footer>Private to the people on the call. Anyone with this link can open it, so share it with care.</footer>
</main>

<script>
(function () {
  var API = (window.RECAP_CONFIG || {}).api || "";
  var q = new URLSearchParams(location.search);
  var id = q.get("id") || "", sig = q.get("sig") || "";
  var $ = function (i) { return document.getElementById(i); };
  var show = function (el, on) { el.classList.toggle("hidden", on === false); };
  var esc = function (s) { var d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; };
  var DL = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 2v8m0 0L4.5 6.5M8 10l3.5-3.5M3 13h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function clock(sec) {
    var s = Math.max(0, Math.round(sec)), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(r).padStart(2, "0");
  }
  function day(iso) { try { return new Date(iso).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" }); } catch (e) { return ""; } }
  function save(name, text) {
    var u = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
    var a = document.createElement("a"); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(u); }, 10000);
  }
  function fail(msg) {
    $("state").innerHTML = '<p style="font-size:16px;margin:0 0 6px;font-weight:600;color:var(--ink)">This recap is not available</p><p style="margin:0">' + esc(msg) + "</p>";
  }
  function brand(b) {
    b = b || {};
    if (/^#[0-9a-f]{6}$/i.test(b.accent || "")) document.documentElement.style.setProperty("--accent", b.accent);
    var name = b.name || "";
    $("brand").innerHTML = (b.logoUrl ? '<img alt="" src="' + esc(b.logoUrl) + '">' : "") + esc(name);
    return name;
  }

  function render(d) {
    var name = brand(d.brand);
    var tl = d.timeline && typeof d.timeline === "object" ? d.timeline : null;
    var when = day(d.startedAt);
    var mins = d.startedAt && d.endedAt ? Math.round((Date.parse(d.endedAt) - Date.parse(d.startedAt)) / 60000) : 0;
    var stamp = (d.startedAt || "").slice(0, 10) || "call";
    var heading = d.title || ("Your call" + (name ? " with " + name : ""));
    $("title").textContent = heading;
    document.title = "Meeting recap" + (when ? ", " + when : "");
    $("meta").textContent = [when, mins > 0 ? mins + " min" : ""].filter(Boolean).join("  ·  ");

    var steps = (tl && Array.isArray(tl.nextSteps) ? tl.nextSteps : [])
      .map(function (s) { return { text: String(s.text || ""), owner: String(s.owner || "") }; })
      .filter(function (s) { return s.text; });
    if (steps.length) {
      $("steps").innerHTML = steps.map(function (s) {
        return '<li><span class="t">' + esc(s.text) + "</span>" + (s.owner ? '<span class="owner">' + esc(s.owner) + "</span>" : "") + "</li>";
      }).join("");
      $("dlSteps").innerHTML = DL + "Download";
      $("dlSteps").addEventListener("click", function () {
        save(stamp + "-next-steps.txt", "Next steps\n" + heading + "\n\n" + steps.map(function (s, i) {
          return (i + 1) + ". " + s.text + (s.owner ? " (" + s.owner + ")" : "");
        }).join("\n") + "\n");
      });
    } else {
      $("steps").outerHTML = '<p class="empty">' + (tl ? "No next steps were agreed on this call." : "Next steps will appear here once the call has been processed.") + "</p>";
      show($("dlSteps"), false);
    }

    // YouTube's privacy-enhanced player, seekable from the timeline.
    var base = d.youtubeId ? "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(d.youtubeId) + "?rel=0&modestbranding=1&playsinline=1" : "";
    function play(at) {
      if (!base) return;
      $("player").innerHTML = '<iframe allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" title="Meeting recording"></iframe>';
      $("player").firstChild.src = base + (at != null ? "&start=" + Math.floor(at) + "&autoplay=1" : "");
    }
    if (base) play(null);
    else $("player").innerHTML = '<div class="ph">The recording will appear here once it has finished processing.</div>';

    var entries = d.entries || [];
    var transcript = entries.length
      ? entries.map(function (e) { return (e.at != null ? "[" + clock(e.at) + "] " : "") + e.speaker + ": " + e.text; }).join("\n")
      : (d.transcript || "");
    if (transcript) {
      $("dlTranscript").innerHTML = DL + "Download transcript";
      show($("dlTranscript")); show($("toggleTranscript"));
      $("dlTranscript").addEventListener("click", function () { save(stamp + "-transcript.txt", heading + "\n\n" + transcript + "\n"); });
      $("turns").innerHTML = transcript.split("\n").filter(Boolean).map(function (line) {
        var m = line.match(/^(\[[^\]]+\]\s*)?([^:]{1,60}):\s*(.*)$/);
        return m ? '<div class="turn"><b>' + esc((m[1] || "") + m[2]) + "</b>" + esc(m[3]) + "</div>" : '<div class="turn">' + esc(line) + "</div>";
      }).join("");
      $("toggleTranscript").addEventListener("click", function () {
        var open = $("turns").classList.contains("hidden");
        show($("turns"), open); this.setAttribute("aria-expanded", String(open));
        this.textContent = open ? "Hide transcript" : "Read transcript";
      });
    }

    var sections = tl && Array.isArray(tl.sections) ? tl.sections : [];
    if (sections.length) {
      show($("tlCard")); show($("tlNote"), Boolean(tl.estimated));
      var approx = tl.estimated ? "~" : "";
      $("timeline").innerHTML = sections.map(function (s, i) {
        return '<li><button class="at" type="button" data-i="' + i + '"' + (base ? "" : " disabled") + ' aria-label="Play from ' + clock(s.start) + '">' + approx + clock(s.start) + "</button>" +
          "<div><strong>" + esc(s.title) + "</strong>" + (s.summary ? "<p>" + esc(s.summary) + "</p>" : "") + "</div></li>";
      }).join("");
      $("timeline").addEventListener("click", function (ev) {
        var b = ev.target.closest(".at"); if (!b || b.disabled) return;
        play(sections[Number(b.dataset.i)].start);
        $("videoCard").scrollIntoView({ behavior: "smooth", block: "start" });
      });
      $("dlTimeline").innerHTML = DL + "Download";
      $("dlTimeline").addEventListener("click", function () {
        save(stamp + "-timeline.txt", "Timeline\n" + heading + (tl.estimated ? "\n(times are approximate)" : "") + "\n\n" +
          sections.map(function (s) { return "[" + clock(s.start) + " - " + clock(s.end) + "] " + s.title + (s.summary ? "\n    " + s.summary : ""); }).join("\n\n") + "\n");
      });
    }

    show($("state"), false);
    show($("content"));
  }

  // Design preview with sample data, on localhost only: /?sample=1
  if (q.get("sample") === "1" && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
    render({
      title: "Discovery call", startedAt: "2026-09-22T15:15:00Z", endedAt: "2026-09-22T15:58:00Z", youtubeId: null,
      brand: { name: "Your Company", accent: "#8c5a3c" },
      timeline: { version: 1, estimated: false, durationSec: 2580,
        nextSteps: [
          { text: "Send a written plan with scope, timeline and price by Friday.", owner: "Jake" },
          { text: "Share read access to the lead spreadsheet.", owner: "Kevin" },
          { text: "Book the plan review call for next week.", owner: "Kevin" } ],
        sections: [
          { start: 0, end: 150, title: "Introductions", summary: "Kevin runs a four-person landscaping business." },
          { start: 150, end: 720, title: "How new leads come in today", summary: "Leads arrive by web form, Instagram DM and phone, and are copied into a spreadsheet by hand." },
          { start: 720, end: 1380, title: "Where the hours go", summary: "About 14 hours a week across intake, follow-up emails and chasing contracts." },
          { start: 1380, end: 2580, title: "Price and next steps", summary: "Current tools cost about $340 a month. Agreed to review a written plan next week." } ] },
      entries: [
        { speaker: "Jake", text: "Thanks for making the time. Walk me through what happens when a new lead comes in.", at: 4 },
        { speaker: "Kevin", text: "It depends where it comes from. The form ones I see right away, the DMs can sit for a day.", at: 11 } ]
    });
    return;
  }

  if (!API || API.indexOf("<project-ref>") !== -1) { fail("This page is not configured yet: set the recap function URL in config.js."); return; }
  if (!id || !sig) { fail("This link is invalid or incomplete. Open the recap from the link you were sent."); return; }
  fetch(API + "?" + new URLSearchParams({ id: id, sig: sig }).toString())
    .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || "Couldn't load this recap (" + r.status + ")."); return j; }); })
    .then(render)
    .catch(function (e) { fail(e && e.message ? e.message : "Couldn't load this recap."); });
})();
</script>
</body>
</html>
